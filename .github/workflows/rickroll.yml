
name: GraphHopper Rickroll

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  graphhopper-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run GraphHopper test
        id: tests
        run: mvn -B -pl core -am -Dtest=ReaderElementTest -Dsurefire.failIfNoSpecifiedTests=false test
      

      - name: Rickroll on test failure
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        uses: ./.github/actions/rickroll
